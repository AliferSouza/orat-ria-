<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1e4fb8">
  <meta name="description" content="Treine oratória e português no seu ritmo, com dados armazenados no dispositivo.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preload" as="style" href="css/estilo.css">
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="preload" as="script" href="js/app.js">
  <title>Oratória Diária</title>
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <a class="marca" href="#inicio" aria-label="Oratória Diária, início">
        <span class="marca-icone" aria-hidden="true">O</span>
        <div>
          <strong>Oratória Diária</strong>
          <small>Comunicação em prática</small>
        </div>
      </a>
      <div class="topo-acoes">
        <button id="tema" class="btn-icone" type="button" aria-label="Alternar tema" title="Alternar tema">◐</button>
        <button id="instalar" class="btn-instalar" type="button" hidden>Instalar app</button>
      </div>
    </div>
  </header>

  <nav class="nav" aria-label="Navegação principal">
    <a href="#inicio" data-rota="inicio" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Início</span></a>
    <a href="#praticar" data-rota="praticar" class="nav-item"><span class="nav-icon">🎯</span><span class="nav-label">Praticar</span></a>
    <a href="#improviso" data-rota="improviso" class="nav-item"><span class="nav-icon">🎲</span><span class="nav-label">Improviso</span></a>
    <a href="#prep" data-rota="prep" class="nav-item"><span class="nav-icon">🧠</span><span class="nav-label">PREP</span></a>
    <a href="#portugues" data-rota="portugues" class="nav-item"><span class="nav-icon">✍️</span><span class="nav-label">Texto</span></a>
    <a href="#teleprompter" data-rota="teleprompter" class="nav-item"><span class="nav-icon">📜</span><span class="nav-label">Teleprompter</span></a>
    <a href="#metronomo" data-rota="metronomo" class="nav-item"><span class="nav-icon">🎚️</span><span class="nav-label">Metrônomo</span></a>
    <a href="#gravacoes" data-rota="gravacoes" class="nav-item"><span class="nav-icon">🎙️</span><span class="nav-label">Gravações</span></a>
    <a href="#progresso" data-rota="progresso" class="nav-item"><span class="nav-icon">📈</span><span class="nav-label">Progresso</span></a>
    <a href="#conquistas" data-rota="conquistas" class="nav-item"><span class="nav-icon">🏆</span><span class="nav-label">Conquistas</span></a>
    <a href="#configuracoes" data-rota="configuracoes" class="nav-item"><span class="nav-icon">⚙️</span><span class="nav-label">Ajustes</span></a>
  </nav>

  <main id="principal" tabindex="-1" aria-live="polite"></main>

  <footer class="rodape">
    <span>Seus textos e registros ficam neste dispositivo.</span>
    <span id="status-offline" class="status">● Preparando modo offline…</span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
